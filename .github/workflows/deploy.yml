# ═══════════════════════════════════════════════════════════════════════════
# النشر إلى خادم العرض.
#
# **هذا الملف لا يعرف الخادم.** لا عنوان، ولا اسم نطاق، ولا مستخدم، ولا منفذ،
# ولا كلمة مرور واحدة. كلّها أسرار مستودع، وجدولها الكامل في deploy/README.md —
# وهو الشيء الوحيد الذي على المالك أن يفعله ليصير هذا الملف قابلاً للتشغيل.
#
# ولماذا يدوي لا على كل دفعة: النشر إلى خادم يراه صاحب قرار حدثٌ يُقرَّر، لا
# أثرٌ جانبي لدمج. والوسم هو بصمة الالتزام، فكل نشرة تُنسب إلى شيفرة بعينها
# ويبقى الرجوع إلى سابقتها ممكناً بأمر واحد.
#
# وترتيب الأمان مقصود: البناء يسبق أي لمس للخادم، فخادمُ العرض لا يُمَسّ إلا
# بصور بُنيت واختُبرت بالفعل.
# ═══════════════════════════════════════════════════════════════════════════

name: النشر

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'الإجراء: نشر أو رجوع إلى النشرة السابقة'
        type: choice
        options: [deploy, rollback]
        default: deploy
      ref:
        description: 'المرجع المراد نشره (فرع أو وسم أو بصمة). الافتراضي: ما شُغّل عليه.'
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  # خادمٌ واحد: نشرتان متزامنتان تتركانه بمزيج من وسمين.
  group: deploy-demo
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ── ١ · البناء والدفع ────────────────────────────────────────────────────
  images:
    name: بناء الصور ودفعها
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      registry: ${{ steps.tag.outputs.registry }}

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: الوسم والسجلّ
        id: tag
        run: |
          set -euo pipefail
          echo "value=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          # اسم المالك يُخفَّض: أسماء الصور في OCI لا تقبل حرفاً كبيراً.
          echo "registry=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # ── إجراءات طرفٍ ثالث: **مثبَّتة على بصمة التزام لا على وسمٍ متحرّك** ──────
      #
      # هذه الوظيفة تحمل ‏`secrets.GITHUB_TOKEN` بصلاحية `packages: write`، وتدفع
      # ثلاث صورٍ إلى السجلّ الذي يُسحب منه الخادم. و‏`@v3` و`@v6` **وسومٌ متحرّكة**
      # يملك مالكُ الإجراء أن يُعيد توجيهها إلى أي التزام في أي لحظة — فمن يملك ذلك
      # الحساب يُشغّل شيفرته داخل وظيفةٍ تحمل رمزاً يدفع صوراً، بلا سطرٍ يتغيّر في
      # هذا المستودع وبلا مراجعةٍ واحدة. والبصمة تُثبّت البايتات: تحديثُ الإجراء يصير
      # **إيداعاً يُقرأ**، لا سحباً لا يقرّره أحد. والوسم بجانب البصمة تعليقٌ للقارئ،
      # ولا يقرؤه المُشغِّل.
      #
      # ‏**و‏`actions/*` بقيت على وسومها عن قصد**، لا سهواً: مالكها هو GitHub نفسه —
      # صاحبُ العدّاء ومُصدِرُ الرمز وحالُّ البصمة معاً. فتثبيتُها لا يزيد حدّ ثقةٍ
      # جديداً: من يستطيع تبديل `actions/checkout` يستطيع تبديل العدّاء تحته. والحدّ
      # الحقيقي هنا هو **منظمة `docker`** — مالكٌ آخر، وهي وحدها ما ثُبِّت. ويفرض ذلك
      # ‏`ThirdPartyActionsArePinnedToACommit` بقائمة **مالكين** لا قائمة إجراءات.
      - name: تهيئة Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: الدخول إلى سجلّ الصور
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ثلاث صور لا واحدة، وهو الفصل نفسه الذي يفرضه ADR-0003 مطبَّقاً على
      # النشر: صورة الترحيل وحدها تحمل اتصال المالك، وصورة الخادم لا تحمله.
      - name: صورة الخادم
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: |
            ${{ steps.tag.outputs.registry }}/babel-api:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: صورة الترحيل والبذر
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile.migrator
          push: true
          tags: |
            ${{ steps.tag.outputs.registry }}/babel-migrator:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

      - name: صورة الواجهة
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: |
            ${{ steps.tag.outputs.registry }}/babel-web:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ── ٢ · النشر ────────────────────────────────────────────────────────────
  deploy:
    name: النشر إلى الخادم
    needs: [images]
    if: always() && (inputs.action == 'rollback' || needs.images.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # مفتاح SSH وبصمة المضيف كلاهما سرّ. **وبصمة المضيف ليست تفصيلاً**:
      # بدونها لا يبقى إلا StrictHostKeyChecking=no، وهو قبولٌ لأي خادم يجيب
      # على العنوان — أي إلغاء المصادقة على الطرف الآخر بالكامل.
      - name: تهيئة SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ] || [ -z "${DEPLOY_SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::‏DEPLOY_SSH_KEY أو DEPLOY_SSH_KNOWN_HOSTS غير مضبوط. جدول الأسرار في deploy/README.md."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: نقل ملفّات الحزمة
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_SSH_USER }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/babel-demo' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER_NAME@$HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/id_deploy -P "$PORT" \
              deploy/compose.yml deploy/Caddyfile deploy/remote.sh \
              "$USER_NAME@$HOST:$DEPLOY_PATH/"
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER_NAME@$HOST" "chmod +x '$DEPLOY_PATH/remote.sh'"

          # ══ النماذج الأوّلية — صفحاتٌ ساكنة تخدمها الحافةُ على /prototypes ══
          #
          # **ولا تدخل صورةً ولا سجلّاً بقصد**: هي صفحاتُ عرضٍ لا منتَج، وحملُها
          # في `babel-web` يوجب بناءَ صورةٍ ودفعَها كلّما صُحِّح سطرٌ في نموذج.
          #
          # **و`tar` عبر الأنبوب لا `scp -r`، وليس ذلك ذوقاً:** `scp -r` إلى
          # مجلّدٍ فيه `prototypes` سلفاً ينسخ **داخله** فيصنع
          # `prototypes/prototypes` — عطلٌ يردّ 404 بلا سطر خطأ واحد في أيّ
          # سجلّ. والأنبوب يحمل الشجرة كما هي في رحلةٍ واحدة مضغوطة.
          #
          # **والمبادلة عبر `.new`:** الحذفُ قبل الحلّ يفتح نافذةَ ثوانٍ يُخدَم
          # فيها مجلّدٌ فارغ. و`mv` داخل نظام الملفّات نفسه بلا نافذة، والقديمُ
          # يُحذف بعدها فلا ينمو القرصُ بنسخةٍ لكلّ نشرة.
          tar -C docs/prototypes -czf - . \
            | ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER_NAME@$HOST" "
                set -eu
                cd '$DEPLOY_PATH'
                rm -rf prototypes.new prototypes.old
                mkdir -p prototypes.new
                tar -C prototypes.new -xzf -
                [ -d prototypes ] && mv prototypes prototypes.old || true
                mv prototypes.new prototypes
                rm -rf prototypes.old
                find prototypes -name '*.html' | wc -l \
                  | xargs printf 'صفحاتٌ على الخادم: %s\n'
              "

      # ملف البيئة يُكتب عبر **المدخل القياسي**، فلا تظهر قيمة واحدة في سطر أمر
      # ولا في `ps` على الخادم ولا في سجلّ سير العمل. وصلاحيته 600 قبل أن يُكتب
      # فيه أول حرف.
      #
      # ‏**وقاعدة العقارات لا تضيف سرّاً إلى هذه القائمة، وذلك مقصود لا سهو:**
      # اتصالها — للمالك في حاوية الترحيل وللتطبيق في حاوية الخادم — يُركَّب في
      # ‏`deploy/compose.yml` من `POSTGRES_PASSWORD` و`BABEL_LEDGER_APP_PASSWORD`
      # المكتوبَين أدناه، واسم قاعدتها ثابت (`babel_realestate`) كأسماء أخواتها.
      # واستحقاق الوحدة يُكتب من `BABEL_DEMO_COMPANY_ID` وهو متغيّر لا سرّ.
      # **فلا يُضاف سرٌّ لا يقرؤه شيء** — وسرٌّ مُوثَّق بلا سلك هو العطل نفسه الذي
      # يُعالَج في هذا الملفّ (‏deploy/README.md §1.1).
      - name: كتابة ملف البيئة على الخادم
        if: inputs.action == 'deploy'
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_SSH_USER }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/babel-demo' }}
          REGISTRY: ${{ needs.images.outputs.registry }}
          TAG: ${{ needs.images.outputs.tag }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BABEL_LEDGER_APP_PASSWORD: ${{ secrets.BABEL_LEDGER_APP_PASSWORD }}
          BABEL_DEMO_TOKEN_SHA256: ${{ secrets.BABEL_DEMO_TOKEN_SHA256 }}
          BABEL_PLATFORM_TOKEN_SHA256: ${{ secrets.BABEL_PLATFORM_TOKEN_SHA256 }}
          BABEL_STORAGE_TICKET_KEY: ${{ secrets.BABEL_STORAGE_TICKET_KEY }}
          BABEL_SITE: ${{ secrets.BABEL_SITE }}
          BABEL_TLS_MODE: ${{ vars.BABEL_TLS_MODE || 'auto' }}
          BABEL_TLS_EMAIL: ${{ secrets.BABEL_TLS_EMAIL }}
          BABEL_DEMO_COMPANY_ID: ${{ vars.BABEL_DEMO_COMPANY_ID || 'd3305e1e-0000-4000-8000-000000000001' }}
          BABEL_DEMO_USER_ID: ${{ vars.BABEL_DEMO_USER_ID || 'd3305e1e-0000-4000-8000-0000000000a1' }}
          # بابُ الدخول للعرض: البريد متغيّرٌ معلَن (ليس سرّاً)، والكلمةُ سرّ.
          # وليست في حلقة الفحص القَبْلي: غيابُها لا يوقف نشرة — يُخطّي بذرَ الباب
          # وحده، ويُقال ذلك في سجلّ الترحيل بنصّه. وجعلُها إلزامية كان سيوقف كل
          # نشرةٍ على كل مستودعٍ لم يضبط السرّ بعدُ، وهو عقابٌ على ميزةٍ اختيارية.
          BABEL_DEMO_SIGNIN_HANDLE: ${{ vars.BABEL_DEMO_SIGNIN_HANDLE || 'demo@salasel-babel.example' }}
          BABEL_DEMO_SIGNIN_PASSWORD: ${{ secrets.BABEL_DEMO_SIGNIN_PASSWORD }}
        run: |
          set -euo pipefail

          missing=""
          for name in POSTGRES_PASSWORD BABEL_LEDGER_APP_PASSWORD BABEL_DEMO_TOKEN_SHA256 \
                      BABEL_PLATFORM_TOKEN_SHA256 BABEL_STORAGE_TICKET_KEY BABEL_SITE; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::أسرار ناقصة:$missing — الجدول في deploy/README.md"
            exit 1
          fi

          # ══ TLS — الأوضاع الأربعة، وشرطُ كلٍّ منها يُفحَص هنا لا على الخادم ══
          #
          # والمنطق في `deploy/tls-mode.sh` لا في هذه السطور، وجدولُ حالاته في
          # `deploy/tls-mode-check.sh` بجانبه — وهو يُشغَّل في «حزمة النشر» على
          # كل دفعة. منطقٌ داخل YAML لا يُشغَّل إلا بدفعة كاملة إلى خادم حقيقي،
          # فلا يُجرَّب ولا يُختبَر: وهو السبب نفسه الذي أخرج `remote.sh` من هنا.
          #
          # والسكربت يرفض ولا يخمّن: `auto` بعنوان IP، ووضع مجهول، وعنوان غير
          # عامّ، ووضع `ip` بلا بريد أو بلا مخطّط — كلّها توقف النشر **قبل** أن
          # تُوقَف الحزمة القائمة على الخادم. ومُخرَجه الوحيد هو العنوان الذي
          # تُقدَّم به الشهادة، مشتقّاً من BABEL_SITE فلا ينحرف عنه.
          if ! BABEL_TLS_IP="$(deploy/tls-mode.sh)"; then
            exit 1
          fi

          if ! printf '%s' "$BABEL_DEMO_TOKEN_SHA256" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::‏BABEL_DEMO_TOKEN_SHA256 ليس بصمة SHA-256 سداسية صغيرة بأربعة وستين محرفاً."
            # ‏**والنصيحة تمرّ بالفحص الذي طبعها.** كانت `… | sha256sum` وحدها، و`sha256sum`
            # يُلحق مسافتين وشَرطة باسم المُدخَل — فمُخرَجها **يرفضه النمط أعلاه حرفياً**.
            # فيُصلح صاحبُ المستودع خطأه بالأمر الذي أعطاه له الحارس، فيسقط ثانيةً بالسبب
            # نفسه ولا يعرف لماذا. وعلاجٌ يُخفق في الفحص الذي أوصى به أسوأ من لا نصيحة.
            echo "::error::احسبها هكذا: printf '%s' \"<الرمز>\" | sha256sum | cut -d' ' -f1"
            exit 1
          fi

          # ‏**واعتماد مشغّل المنصّة بصمةٌ ثانية بالشكل نفسه — ومختلفةٌ عن الأولى** (ADR-0092):
          # بصمةٌ واحدة للاثنين تجعل كلَّ من سُلِّم رمزَ العرض مسعِّراً لكتالوج المنصّة.
          if ! printf '%s' "$BABEL_PLATFORM_TOKEN_SHA256" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::‏BABEL_PLATFORM_TOKEN_SHA256 ليس بصمة SHA-256 سداسية صغيرة بأربعة وستين محرفاً."
            echo "::error::احسبها هكذا: printf '%s' \"<اعتماد المشغّل>\" | sha256sum | cut -d' ' -f1"
            exit 1
          fi
          if [ "$BABEL_PLATFORM_TOKEN_SHA256" = "$BABEL_DEMO_TOKEN_SHA256" ]; then
            echo "::error::‏BABEL_PLATFORM_TOKEN_SHA256 تساوي BABEL_DEMO_TOKEN_SHA256 — رمزُ العرض لا يكون اعتمادَ مشغّل المنصّة."
            exit 1
          fi

          # ‏**والمفتاح يُفحص شكلاً هنا لا على الخادم.** `Convert.FromHexString` يرمي
          # على محرفٍ غير سداسي وعلى طولٍ فردي، و`SignedAttachmentTickets` يرفض ما
          # دون 32 بايتاً — والثلاثة تقع **بعد** أن تُسحب الصور وتُقام الحاويات، فيُقرأ
          # الفشل «الخادم لا يقلع» لا «المفتاح شكله خاطئ». والزوج `([0-9a-f]{2})` يقيس
          # البايت لا المحرف، فالطول الفردي مرفوض بحكم النمط نفسه.
          if ! printf '%s' "$BABEL_STORAGE_TICKET_KEY" | grep -qE '^([0-9a-f]{2}){32,}$'; then
            echo "::error::‏BABEL_STORAGE_TICKET_KEY ليس مفتاحاً سداسياً صغيراً بـ32 بايتاً فأكثر (64 محرفاً فأكثر، وعددها زوجي)."
            echo "::error::ولّده هكذا: head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \\n'"
            echo "::error::ولا يُولَّد على الخادم ولا عند الإقلاع: مفتاحٌ يتغيّر يُبطل كل تذكرة سابقة، والفشل يُقرأ «انتهت الصلاحية» لا «لا مفتاح» (ADR-0046)."
            exit 1
          fi

          # ‏**وكلمةُ بابِ الدخول تُفحص طولاً هنا لا على الخادم.** الحدّ اثنا عشر
          # محرفاً (‏`AccessPasswords.MinimumPasswordLength`)، و`SetPasswordAsync`
          # يردّ `access.password_length_rejected` على ما دونه — **داخل حاوية
          # الترحيل، بعد أن سُحبت الصور وأُقيمت الحزمة**، فيخرج الترحيل بغير صفر
          # ويرتدّ النشر كلُّه إلى الإصدار السابق. وثمنُ اكتشاف خطأٍ مطبعيّ في سرٍّ
          # اختياري دورةُ نشرٍ كاملة. والفراغُ يمرّ: غيابُه يُخطّي بذرَ الباب بقصد.
          if [ -n "$BABEL_DEMO_SIGNIN_PASSWORD" ] && [ "${#BABEL_DEMO_SIGNIN_PASSWORD}" -lt 12 ]; then
            echo "::error::‏BABEL_DEMO_SIGNIN_PASSWORD أقصر من اثني عشر محرفاً — والطولُ وحده ما يُقاس (ADR-0094)."
            echo "::error::واتركه فارغاً إن لم ترد بذرَ بابِ دخولٍ أصلاً؛ حينها تُخطّى الخطوة ولا تُوقف النشرة."
            exit 1
          fi

          {
            echo "BABEL_REGISTRY=$REGISTRY"
            echo "BABEL_IMAGE_TAG=$TAG"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "BABEL_LEDGER_APP_PASSWORD=$BABEL_LEDGER_APP_PASSWORD"
            echo "BABEL_LEDGER_APP_ROLE=babel_ledger_app"
            echo "BABEL_DEMO_TOKEN_SHA256=$BABEL_DEMO_TOKEN_SHA256"
            echo "BABEL_PLATFORM_TOKEN_SHA256=$BABEL_PLATFORM_TOKEN_SHA256"
            echo "BABEL_STORAGE_TICKET_KEY=$BABEL_STORAGE_TICKET_KEY"
            echo "BABEL_SITE=$BABEL_SITE"
            echo "BABEL_TLS_MODE=$BABEL_TLS_MODE"
            echo "BABEL_TLS_EMAIL=$BABEL_TLS_EMAIL"
            echo "BABEL_TLS_IP=$BABEL_TLS_IP"
            echo "BABEL_DEMO_COMPANY_ID=$BABEL_DEMO_COMPANY_ID"
            echo "BABEL_DEMO_USER_ID=$BABEL_DEMO_USER_ID"
            echo "BABEL_DEMO_SIGNIN_HANDLE=$BABEL_DEMO_SIGNIN_HANDLE"
            echo "BABEL_DEMO_SIGNIN_PASSWORD=$BABEL_DEMO_SIGNIN_PASSWORD"
          } | ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER_NAME@$HOST" \
                "umask 077 && cat > '$DEPLOY_PATH/.env.new' && mv '$DEPLOY_PATH/.env.new' '$DEPLOY_PATH/.env'"

      # الاعتماد إلى سجلّ الصور يمرّ بالمدخل القياسي أيضاً، ويُمحى فور السحب:
      # خادم عرض لا يحتاج أن يبقى قادراً على سحب صور خاصة بعد انتهاء النشر.
      - name: النشر أو الرجوع
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_SSH_USER }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/babel-demo' }}
          TAG: ${{ needs.images.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER_NAME@$HOST" \
            "docker login ghcr.io --username '$ACTOR' --password-stdin"

          set +e
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER_NAME@$HOST" \
            "cd '$DEPLOY_PATH' && ./remote.sh ${ACTION} ${TAG}"
          status=$?
          set -e

          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER_NAME@$HOST" "docker logout ghcr.io" || true
          exit "$status"

      - name: البصمة المنشورة
        if: success()
        env:
          TAG: ${{ needs.images.outputs.tag }}
        run: echo "::notice::النشرة الحيّة الآن بالوسم ${TAG:-<رجوع>}"

      - name: محو المفتاح
        if: always()
        run: rm -f ~/.ssh/id_deploy
