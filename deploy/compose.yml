# ═══════════════════════════════════════════════════════════════════════════
# حزمة العرض — خمس خدمات، وترتيبها هو نصف القرار.
#
#   db        PostgreSQL 16 على حجم مسمّى. لا منفذ منشور.
#   migrator  يعمل **مرّة** ثم يخرج: تهيئة ← هجرات ← بذر ← إثبات.
#             وهو وحده يحمل اتصال المالك واتصال الصيانة.
#   api       يقلع **بعد** خروج migrator بنجاح، وبدور التطبيق وحده.
#   web       ملفّات ثابتة + وسيط على الأصل نفسه.
#   edge      Caddy: هو الوحيد الذي ينشر منفذاً، وهو مصدر الشهادة.
#
# **ولا قيمة بيئة واحدة مكتوبة في هذا الملف.** كلّها ‎${…}‎ تُقرأ من ملف .env
# يُكتب على الخادم لحظة النشر من مخزن أسرار، وهو في .gitignore بحكم `.env`.
# جدول ما يجب أن يحتويه في deploy/README.md.
# ═══════════════════════════════════════════════════════════════════════════
name: babel-demo

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?كلمة مرور المستخدم الخارق لـPostgreSQL}
      POSTGRES_DB: postgres
      # ترتيب مستقلّ عن لغة المضيف: الفرز الثقافي يختلف بين ثقافتين على الحروف
      # نفسها، والمخطّط لا يجوز أن يعتمد على لغة الخادم (القاعدة 10).
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrator:
    image: ${BABEL_REGISTRY:?سجلّ الصور}/babel-migrator:${BABEL_IMAGE_TAG:?وسم الصورة — لا افتراضي عمداً}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # الصيانة والمالك — **هنا وحدها**.
      BABEL_ADMIN_DB: "Host=db;Port=5432;Database=postgres;Username=postgres;Password=${POSTGRES_PASSWORD}"
      BABEL_LEDGER_OWNER_DB: "Host=db;Port=5432;Database=babel_ledger;Username=postgres;Password=${POSTGRES_PASSWORD}"
      BABEL_SALES_OWNER_DB: "Host=db;Port=5432;Database=babel_sales;Username=postgres;Password=${POSTGRES_PASSWORD}"
      BABEL_PURCHASING_OWNER_DB: "Host=db;Port=5432;Database=babel_purchasing;Username=postgres;Password=${POSTGRES_PASSWORD}"
      # ‏**وسطرُ المخزون كان ناقصاً، وأثره أنّ الترحيل يسقط** — لا أنّ المخزون يتعطّل:
      # ‏`Settings.FromEnvironment` يرتدّ عند غيابه إلى نصٍّ افتراضي على `127.0.0.1`،
      # وهو **داخل حاوية الترحيل نفسها** لا قاعدةَ فيها. فتُنشأ القاعدة في خطوة التهيئة
      # ثم يفشل نشر مخطّطها بـ«Connection refused»، ويخرج الترحيل بغير صفر، ويتوقّف
      # النشر كلّه. وهذا هو الشكل الأخطر من النقص: **افتراضٌ صامت** لا صيغة ‎:?‎ —
      # فلا شيء يقول «متغيّر ناقص»، بل يُقرأ العطل شبكةً في قاعدة البيانات.
      BABEL_INVENTORY_OWNER_DB: "Host=db;Port=5432;Database=babel_inventory;Username=postgres;Password=${POSTGRES_PASSWORD}"
      BABEL_CORE_OWNER_DB: "Host=db;Port=5432;Database=babel_core;Username=postgres;Password=${POSTGRES_PASSWORD}"
      # واتصال التطبيق: يُستعمل في خطوتَي البذر والإثبات — وهو ما يجعل البذر
      # عاجزاً بنيوياً عن الكتابة خارج ledger.post_entry.
      BABEL_LEDGER_APP_DB: "Host=db;Port=5432;Database=babel_ledger;Username=${BABEL_LEDGER_APP_ROLE:-babel_ledger_app};Password=${BABEL_LEDGER_APP_PASSWORD}"
      BABEL_LEDGER_APP_ROLE: ${BABEL_LEDGER_APP_ROLE:-babel_ledger_app}
      BABEL_CORE_APP_DB: "Host=db;Port=5432;Database=babel_core;Username=${BABEL_LEDGER_APP_ROLE:-babel_ledger_app};Password=${BABEL_LEDGER_APP_PASSWORD}"
      BABEL_CORE_APP_ROLE: ${BABEL_LEDGER_APP_ROLE:-babel_ledger_app}
      BABEL_LEDGER_APP_PASSWORD: ${BABEL_LEDGER_APP_PASSWORD:?كلمة مرور دور التطبيق}
      BABEL_DEMO_COMPANY_ID: ${BABEL_DEMO_COMPANY_ID:-d3305e1e-0000-4000-8000-000000000001}
      BABEL_DEMO_FISCAL_YEAR: ${BABEL_DEMO_FISCAL_YEAR:-2026}
    command: ["all"]

  api:
    image: ${BABEL_REGISTRY}/babel-api:${BABEL_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      # ‏**اتصال دور التطبيق وحده.** لا BABEL_LEDGER_OWNER_DB هنا، ولا يجوز أن
      # يوجد: خادمٌ يحمل اتصال المالك يستطيع إسقاط المشغّل المؤجَّل ثم الكتابة
      # فوق قيد مُرحَّل، فتسقط طبقتا الحصانة معاً (ADR-0003).
      BABEL_LEDGER_APP_DB: "Host=db;Port=5432;Database=babel_ledger;Username=${BABEL_LEDGER_APP_ROLE:-babel_ledger_app};Password=${BABEL_LEDGER_APP_PASSWORD};Maximum Pool Size=20"
      BABEL_LEDGER_APP_ROLE: ${BABEL_LEDGER_APP_ROLE:-babel_ledger_app}
      # النواة: تأسيس المنشأة ومراكز تكلفتها وملفّ قدراتها. **اتصال دور التطبيق
      # وحده** كذلك — ولا BABEL_CORE_OWNER_DB هنا: خادمٌ يحمله يستطيع إسقاط مشغّل
      # ثبات مقياس العرض ثم كتابة مقياس آخر على منشأة قائمة.
      BABEL_CORE_APP_DB: "Host=db;Port=5432;Database=babel_core;Username=${BABEL_LEDGER_APP_ROLE:-babel_ledger_app};Password=${BABEL_LEDGER_APP_PASSWORD};Maximum Pool Size=10"
      BABEL_CORE_APP_ROLE: ${BABEL_LEDGER_APP_ROLE:-babel_ledger_app}
      # دليل الاعتمادات: **بصمة** لا اعتماد. الخادم لا يعرف الرمز الأصلي أبداً.
      Babel__Api__Tokens__0__Sha256: ${BABEL_DEMO_TOKEN_SHA256:?بصمة SHA-256 لرمز العرض}
      Babel__Api__Tokens__0__Tenant: ${BABEL_DEMO_COMPANY_ID:-d3305e1e-0000-4000-8000-000000000001}
      Babel__Api__Tokens__0__User: ${BABEL_DEMO_USER_ID:-d3305e1e-0000-4000-8000-0000000000a1}
      Babel__Api__Tokens__0__Companies__0: ${BABEL_DEMO_COMPANY_ID:-d3305e1e-0000-4000-8000-000000000001}
      # ── الموارد البشرية ──────────────────────────────────────────────────
      # ‏**هذا السطر شرطُ إقلاع لا إعداداً اختيارياً.** `Program.cs` يستدعي
      # `HrOptions.EnsureConfigured()` عند التركيب، وهي **ترفض الغياب** لأن هذه
      # الوحدة أثقل جدول بيانات شخصية في المنتج فلا يجوز أن يشير خادمٌ بها إلى
      # قاعدة لم يقصدها أحد. وبلا هذا السطر لا تقلع حاوية `api` أصلاً، فيفشل
      # ‏`compose up --wait` ويرتدّ النشر — **وهو ما وقع** حين نزلت الوحدة ولم
      # تنزل معها خانتها هنا.
      # **ومخطّط `hr` غير منشور في حاوية الترحيل بعد**، كمخطّط `storage`: القاعدة
      # مسمّاة هنا كي يقلع الخادم ويفشل أول نداء موارد بشرية بعطل اتصال مقروء،
      # لا كي يُدّعى أن الوحدة تعمل. وذلك نقصٌ مُعلَن.
      BABEL_HR_DB: "Host=db;Port=5432;Database=babel_hr;Username=${BABEL_LEDGER_APP_ROLE:-babel_ledger_app};Password=${BABEL_LEDGER_APP_PASSWORD};Maximum Pool Size=5"
      # ── مخزن المرفقات ────────────────────────────────────────────────────
      # ‏**ولا مفتاح افتراضي هنا ولا في أي ملفّ مُودَع**: `:?` يوقف `compose up`
      # برسالة تسمّي المتغيّر، بدل أن تُقلع حاوية تسقط عند التركيب. ومفتاحٌ
      # مُودَع مفتاحٌ عامّ يسكّ به من يقرأ المستودع تذاكرَ أي مرفق (ADR-0046).
      BABEL_STORAGE_TICKET_KEY: ${BABEL_STORAGE_TICKET_KEY:?مفتاح توقيع تذاكر المرفقات — 32 بايتاً ست‌عشرياً على الأقل، من البيئة ولا يُودَع}
      BABEL_STORAGE_ROOT: /var/lib/babel/attachments
      # واتصال دور التطبيق وحده، كالدفتر والنواة: خادمٌ يحمل اتصال المالك يستطيع
      # إسقاط مشغّل «يُضاف ولا يُعدَّل» ثم الكتابة فوق سند إثبات.
      BABEL_STORAGE_APP_DB: "Host=db;Port=5432;Database=babel_storage;Username=${BABEL_STORAGE_APP_ROLE:-babel_storage_app};Password=${BABEL_STORAGE_APP_PASSWORD:-};Maximum Pool Size=10"
      BABEL_STORAGE_APP_ROLE: ${BABEL_STORAGE_APP_ROLE:-babel_storage_app}
      Logging__LogLevel__Default: ${BABEL_LOG_LEVEL:-Information}
    volumes:
      # البايتات على حجم دائم لا في طبقة الحاوية: حاويةٌ تُستبدَل تأخذ معها كل
      # سند إثبات فيها. **ونشرُ مخطّط `storage` وإنشاء دوره ليسا في حاوية الترحيل
      # بعد** — فأبواب المرفقات غير قابلة للبلوغ حتى يُزوَّدا، وذلك نقصٌ مُعلَن.
      - babel-attachments:/var/lib/babel/attachments

  web:
    image: ${BABEL_REGISTRY}/babel-web:${BABEL_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # اسم النطاق يحكم شكل الشهادة كلّه. القيمة الفارغة تعني «بلا نطاق»،
      # وحينها Caddy يُصدر شهادة من سلطته الداخلية — انظر Caddyfile وREADME §3.
      BABEL_SITE: ${BABEL_SITE:-:80}
      BABEL_TLS_MODE: ${BABEL_TLS_MODE:-auto}
      # ‏`:-` لا `:?`: يُبدَّل عند الغياب **وعند الفراغ** معاً — والفراغ هو الحالة
      # التي كسرت الحافة (انظر Caddyfile).
      BABEL_TLS_EMAIL: ${BABEL_TLS_EMAIL:-tls-email-not-set@invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
  # بايتات المرفقات — سندُ إثبات لا يُحذف، فلا يعيش في طبقة حاوية تُستبدَل.
  babel-attachments:
