# ═══════════════════════════════════════════════════════════════════════════
# الواجهة: ملفّات ثابتة + وسيط عكسي على **الأصل نفسه**.
#
# ولماذا الأصل نفسه لا مِنشأ ثانٍ للخلفية: الواجهة تُبنى مرّة واحدة لكل البيئات
# (‏baseUrl الافتراضي فراغ = الأصل نفسه — web/src/app/config.ts). عنوانٌ يُخبَز
# في الحزمة وقت البناء يعني حزمةً لكل خادم، ومعها CORS وطبقة إعداد ثانية لا
# تُختبر إلا في الإنتاج.
#
# والاعتماد **لا يمرّ من هنا ولا يُخزَّن هنا**: يصل ترويسةً من المتصفّح إلى
# الخلفية كما هو.
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # لا إعلان عن الإصدار: معلومةٌ مجانية لمن يفحص، بلا فائدة لمن يستعمل.
    server_tokens off;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml application/wasm;

    # الأصول مبصومة بالمحتوى (‏index-<hash>.js) فتُخزَّن طويلاً بلا خطر تعتيق.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # وindex.html **لا يُخزَّن أبداً**: هو الذي يسمّي البصمات، فتخزينُه يجمّد
    # نشرةً كاملة في متصفّح صاحب القرار وقت العرض.
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /health {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # حدّ جسم الطلب هنا مطابق لحدّ Kestrel (‏BabelApiHost.MaxRequestBodyBytes):
        # حدّان مختلفان يعنيان رفضاً برمز 413 من طبقة لا تعرف عقد الأخطاء.
        client_max_body_size 1m;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
